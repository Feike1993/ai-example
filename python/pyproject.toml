[project]
name = "ai-example"
version = "0.1.0"
description = "AI Agent 学习样例：Python 对照（OpenAI + LangGraph）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.99.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "langgraph>=1.2.11",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_example"]

[tool.hatch.build.targets.wheel.sources]
"src/ai_example" = "ai_example"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
