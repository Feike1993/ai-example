plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.feike'
version = '0.1.0-SNAPSHOT'

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public/') }
    maven { url = uri('https://maven.aliyun.com/repository/spring/') }
    mavenCentral()
}

dependencies {
    implementation platform("org.springframework.ai:spring-ai-bom:${libs.versions.springAi.get()}")
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // 会话表结构版本化；Flyway 10+ 起 PostgreSQL 支持拆成独立模块
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // 工业级链路：run 状态注册表 + SSE 事件回放流
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // Redis（Lettuce）会拉 Netty DNS；Spring 默认常只解析到 osx-x86_64，
    // Apple Silicon 启动时找不到 aarch_64.jnilib 会打 ERROR 并回退系统 DNS。
    // 显式声明两个 classifier，避免 arm64 / Intel Mac 各缺一边。
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-x86_64'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.junit.jupiter
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql
    // Redis 事件回放集成测试用 GenericContainer 起 redis:7-alpine
    testImplementation libs.testcontainers.core
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Java 22+：Netty（Lettuce Redis / 部分 HTTP 客户端）会调 System.loadLibrary，
// 不声明 native access 会打 WARNING，未来版本可能直接拒绝。
def jvmNativeAccessArgs = [
    '-Dfile.encoding=UTF-8',
    '-Dconsole.encoding=UTF-8',
    '--enable-native-access=ALL-UNNAMED',
]

tasks.named('bootJar') {
    archiveFileName = 'ai-example.jar'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs = jvmNativeAccessArgs
}

tasks.named('bootRun') {
    jvmArgs = jvmNativeAccessArgs
    // 双保险：IDE 若绕过 jvmArgs、但加载了仓库 .env，也能吃到
    environment 'JAVA_TOOL_OPTIONS', '--enable-native-access=ALL-UNNAMED'

    def envFile = rootProject.file('../.env')
    if (!envFile.exists()) {
        envFile = rootProject.file('.env')
    }
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            def val = trimmed.substring(eq + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}
