server:
  port: 8080
  servlet:
    context-path: /ai-example
    error:
    # 样例路径仍可能走 Boot 默认错误体，保留 reason；工业级 /api/v1 由 ProductionExceptionHandler 输出 {code,message}
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        # Jaeger all-in-one 只收 trace；本仓指标走 Prometheus scrape。
        enabled: false
  tracing:
    sampling:
      probability: ${OTEL_SAMPLE_PROBABILITY:1.0}
    export:
      otlp:
        # 默认关：未起 Jaeger 时 HttpExporter 会 ERROR Failed to export spans。
        # 本地要看 Trace：起 jaeger，并设 OTEL_TRACING_EXPORT=true。
        enabled: ${OTEL_TRACING_EXPORT:false}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # PostgreSQL 是默认 jdbc 会话与 pgvector 的硬依赖，readiness 必须反映数据库状态。
          # Redis 是工业级链路 run 状态与 SSE 断线续传的硬依赖，同样纳入就绪判定。
          include: readinessState,db,redis

spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: ai-example
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:ai_example}
    username: ${PG_USER:ai}
    password: ${PG_PASSWORD:ai}
    hikari:
      # 无 Docker 时允许进程起来；真正 ingest/query 仍会因连不上库失败
      initialization-fail-timeout: -1
  flyway:
    # 注意这里与上面 initialization-fail-timeout: -1 的取舍相反：Flyway 在启动期跑迁移，
    # 连不上库就直接启动失败。表结构对不上时让进程起不来，好过跑起来之后每个请求各报各的错。
    # 想保留「没有 Docker 也能起进程」的调试体验，设 FLYWAY_ENABLED=false。
    enabled: ${FLYWAY_ENABLED:true}
    # 存量库里 chat_session_message 已由旧版 @PostConstruct 建好，
    # 没有 flyway_schema_history 表。baseline 让 V1 在这类库上也能顺利接管。
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Lettuce 懒连：与 datasource 同样的取舍，Redis 不可用不拖垮启动，只让工业级接口 503
      timeout: 3s
      connect-timeout: 2s
  ai:
    openai:
      # 仅占位：真正的 ChatClient 由 LlmProviderRegistry 按 app.ai.providers 手动创建，避免双模型
      api-key: ${AI_API_KEY:placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
    retry:
      max-attempts: 1
      on-client-errors: false
    mcp:
      server:
        # remote 默认关；inprocess 时设 MCP_SERVER_ENABLED=true
        enabled: ${MCP_SERVER_ENABLED:false}
        name: ai-example-mcp
        version: 0.1.0
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
      client:
        # remote 默认开，连旁进程 mcp-server:8081
        enabled: ${MCP_CLIENT_ENABLED:true}
        # false：建 Bean 时跳过 initialize()，避免启动期强连 8081；真正 listTools/chat 时再懒连
        initialized: ${MCP_CLIENT_INITIALIZED:false}
        request-timeout: 30s
        type: SYNC
        streamable-http:
          connections:
            demo:
              url: ${MCP_REMOTE_URL:http://localhost:8081}
              endpoint: /mcp
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:pgvector}
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true

app:
  ai:
    default-provider: ${AI_PROVIDER:deepseek}
    # 调度器参数；各 Provider 可单独覆盖
    temperature: ${AI_TEMPERATURE:0.2}
    embedding-provider: dashscope
    embedding:
      model: text-embedding-v3
      dimensions: 1024
    rag:
      enabled: ${RAG_ENABLED:true}
      top-k: 4
      chunk-size: 400
      # 命中条数 < min-sources 视为空检索；空检索默认跳过 LLM 直接拒答
      min-sources: ${RAG_MIN_SOURCES:1}
      skip-llm-when-empty: ${RAG_SKIP_LLM_WHEN_EMPTY:true}
      hybrid:
        enabled: ${RAG_HYBRID_ENABLED:true}
        rrf-k: ${RAG_RRF_K:60}
        keyword-top-k: ${RAG_KEYWORD_TOP_K:4}
        rewrite-query-enabled: ${RAG_REWRITE_QUERY:false}
      hyde:
        enabled: ${RAG_HYDE_ENABLED:true}
        fuse-with-original: ${RAG_HYDE_FUSE:true}
      chunking:
        semantic-corpus: ${RAG_SEMANTIC_CORPUS:ai-example-demo-semantic}
        parent-corpus: ${RAG_PARENT_CORPUS:ai-example-demo-parent}
        child-size: ${RAG_CHILD_SIZE:200}
        expand-parent: ${RAG_EXPAND_PARENT:true}
    mcp:
      # 仅作启动初始值；运行时可被 PUT /mcp/mode 覆盖（内存、不持久化，重启回此配置）
      # remote=连 mcp-server:8081；inprocess=同进程 MethodToolCallbackProvider（不必开主应用 MCP Server HTTP）
      mode: ${MCP_MODE:remote}
      # 与 mcp-server app.mcp.auth.bearer-token / MCP_BEARER_TOKEN 保持一致
      remote-bearer-token: ${MCP_BEARER_TOKEN:dev-mcp-token}
    providers:
      deepseek:
        label: DeepSeek
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:${AI_API_KEY:}}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
      dashscope:
        label: 阿里云百炼
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${PROVIDER_DASHSCOPE_API_KEY:}
        model: ${PROVIDER_DASHSCOPE_MODEL:qwen3.8-max}
      kimi:
        label: Kimi
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
      glm:
        label: 智谱 GLM
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
      # id 不用 qwen3.5：YAML/Spring 会把点当成嵌套路径
      qwen35:
        label: qwen3.5
        base-url: https://vllm.naradapower.com
        api-key: ${PROVIDER_QWEN35_API_KEY:}
        model: ${PROVIDER_QWEN35_MODEL:qwennaradav1}
        # 默认 thinking 时 OpenAI 兼容响应 content=null、正文在 reasoning，本仓读不到
        enable-thinking: false
        # 域名常解析到内网 IP；IDEA https.proxyHost 不会因 10.0.0.0/8 nonProxy 规则绕过主机名
        # true: 忽略 JVM 代理设置，直连 false: 按 JVM 代理设置代理
        bypass-proxy: true
    # 结构化输入参数
    structured:
      # 重试次数
      max-attempts: 2
      # 是否包含最后一个错误
      include-last-error: true
      # 重试时是否使用修复提示
      retry-use-repair-prompt: true
      # 重试时是否附加严格的 JSON 指令
      retry-append-strict-json-instruction: true
      # 错误消息最大长度
      error-message-max-length: 200
      # 模式验证是否启用
      schema-validation-enabled: false
    # 代理相关配置
    agent:
      # 最大步骤数
      max-steps: 8
    # 上下文相关配置
    context:
      # 最大消息数
      max-messages: 24
      # 令牌预算
      token-budget: 2000
      # 保持最近消息数
      keep-recent-messages: 6
      # jdbc=PostgreSQL 持久化；memory=进程内 Map
      store: ${CONTEXT_STORE:jdbc}
    memory:
      top-k: 4
      user-id-default: demo
      # 相似事实合并：score≥该值则删旧写新（精确相同则跳过）
      similarity-threshold: 0.92
      # 单次 /memory/extract 最多写入条数
      extract-max-facts: ${MEMORY_EXTRACT_MAX:5}
    # 多代理相关配置
    multiagent:
      # 最大 Orchestrator 步骤数，作用：限制 Orchestrator 的递归调用深度，防止无限递归
      # Orchestrator是：一个代理，负责协调多个代理
      max-orchestrator-steps: 4
      # 最大 Worker 步骤数，作用：限制 Worker 的递归调用深度，防止无限递归
      max-worker-steps: 6
    # 第十一期：输出护栏（确定性词表；失败短路）
    guardrail:
      deny-words:
        - 违禁演示词
        - BLOCKED_DEMO

  # 工业级链路：与 app.ai.*（教学样例）完全分开的一套配置
  production:
    # 代码里默认 false（属性缺失时不启用）；本仓部署显式打开
    enabled: ${PRODUCTION_ENABLED:true}
    # 独立语料，不与样例 ai-example-demo 混写，避免教学 ingest 覆盖生产索引
    corpus: ${PRODUCTION_CORPUS:ai-example-prod}
    top-k: ${PRODUCTION_TOP_K:4}
    chunk-size: ${PRODUCTION_CHUNK_SIZE:400}
    min-sources: ${PRODUCTION_MIN_SOURCES:1}
    hybrid-enabled: ${PRODUCTION_HYBRID:true}
    rrf-k: ${PRODUCTION_RRF_K:60}
    keyword-top-k: ${PRODUCTION_KEYWORD_TOP_K:4}
    # 默认 none：不额外打 LLM。rewrite / hyde 由请求覆盖，工业页可开关。
    query-expansion:
      default: ${PRODUCTION_QUERY_EXPANSION:none}
      hyde-fuse-with-original: ${PRODUCTION_HYDE_FUSE:true}
    stream:
      # redis=跨实例可续传；memory=单进程，仅测试用
      event-log: ${PRODUCTION_EVENT_LOG:redis}
      # run 事件保留窗口：断线重连必须在此窗口内带 Last-Event-ID 回来，过期返回 410
      replay-ttl: ${PRODUCTION_REPLAY_TTL:10m}
      # 心跳注释帧间隔，防止代理在长思考期间掐断连接
      heartbeat-interval: ${PRODUCTION_HEARTBEAT:15s}
      # 单条 run 的墙钟上限，超时发 error 事件而不是无限挂着
      timeout: ${PRODUCTION_STREAM_TIMEOUT:5m}
    session:
      # 多轮会话依赖 Flyway 建的 prod_chat_* 两张表；FLYWAY_ENABLED=false 时应一并关掉
      enabled: ${PRODUCTION_SESSION_ENABLED:true}
      # redis=跨实例互斥；memory=单进程，多实例下等于没有锁
      lock: ${PRODUCTION_SESSION_LOCK:redis}
      max-messages: ${PRODUCTION_SESSION_MAX_MESSAGES:20}
      token-budget: ${PRODUCTION_SESSION_TOKEN_BUDGET:2000}
      # 要明显长于 stream.timeout，否则一次慢生成就会让锁在持有期间过期
      lock-ttl: ${PRODUCTION_SESSION_LOCK_TTL:6m}
      # seq 取号撞上主键时的重试次数；正常并发下一次就够，留余量应对突发
      seq-retries: ${PRODUCTION_SESSION_SEQ_RETRIES:3}
    security:
      # Base64 的 32 字节 AES-256 KEK。生成：openssl rand -base64 32
      # 空则 /api/v1 503，教学样例不受影响
      kek: ${PRODUCTION_KEK:}
      # 轮换窗口：旧密文仍用上一把解，重加密后可去掉
      kek-previous: ${PRODUCTION_KEK_PREVIOUS:}
      # postgres=密文进 prod_secret；env=仅内存，单测用
      secret-store: ${PRODUCTION_SECRET_STORE:postgres}
      kek-id: ${PRODUCTION_KEK_ID:v1}
      jwt-ttl: ${PRODUCTION_JWT_TTL:8h}
      deny-words:
        - 违禁演示词
        - BLOCKED_DEMO
    rate-limit:
      capacity: ${PRODUCTION_RATE_CAPACITY:30}
      window: ${PRODUCTION_RATE_WINDOW:60s}
      login-capacity: ${PRODUCTION_LOGIN_CAPACITY:10}
      idempotency-ttl: ${PRODUCTION_IDEMPOTENCY_TTL:10m}
    agent:
      max-steps: ${PRODUCTION_AGENT_MAX_STEPS:6}
      public-tenant-id: public
    users:
      - username: alice
        password: demo
        tenant: tenant-a
        roles:
          - USER
      - username: bob
        password: demo
        tenant: tenant-b
        roles:
          - USER
      - username: admin
        password: demo
        tenant: tenant-a
        roles:
          - ADMIN
          - USER
