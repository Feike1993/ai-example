server:
  port: 8080
  servlet:
    context-path: /ai-example

spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: ai-example
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      # 仅占位：真正的 ChatClient 由 LlmClientFactory 按 app.ai 手动创建，避免双模型
      api-key: ${AI_API_KEY:placeholder}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    retry:
      max-attempts: 1
      on-client-errors: false

app:
  ai:
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen3.5-flash}
    # 调度器参数
    temperature: ${AI_TEMPERATURE:0.2}
    # 结构化输入参数
    structured:
      # 重试次数
      max-attempts: 2
      # 是否包含最后一个错误
      include-last-error: true
      # 重试时是否使用修复提示
      retry-use-repair-prompt: true
      # 重试时是否附加严格的 JSON 指令
      retry-append-strict-json-instruction: true
      # 错误消息最大长度
      error-message-max-length: 200
      # 模式验证是否启用
      schema-validation-enabled: false
    agent:
      # 最大步骤数
      max-steps: 8
