upstream industrial_java {
    least_conn;
    server java-a:8080;
    server java-b:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Java 配置了 /ai-example context path，代理时必须保留该前缀。
    location = /ai-example {
        return 308 /ai-example/;
    }

    # 同一代理块同时服务普通 API 与 SSE；关闭缓冲，避免模型增量被攒成整块。
    # least_conn 打到两台 Java；响应头 X-Instance-Id 标明这一枪落在哪台。
    location /ai-example/ {
        proxy_pass http://industrial_java;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
