# 工业级第四阶段默认 Playwright（不打 Chat LLM / Embedding）。
# 与教学第四期 Hybrid RAG（docs/phase4.md）不是同一件事。
name: industrial-e2e

on:
  push:
    paths:
      - 'frontend/**'
      - 'java/**'
      - 'docker-compose.yml'
      - '.github/workflows/industrial-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'java/**'
      - 'docker-compose.yml'
      - '.github/workflows/industrial-e2e.yml'

jobs:
  default-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_example
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai -d ai_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: 安装 Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: 生成 KEK、启动 Java 并跑默认 E2E
        env:
          MCP_CLIENT_ENABLED: 'false'
          OTEL_TRACING_EXPORT: 'false'
          CI: 'true'
          JAVA_TOOL_OPTIONS: '--enable-native-access=ALL-UNNAMED'
        run: |
          set -eu
          export PRODUCTION_KEK="$(openssl rand -base64 32)"
          cd java
          ./gradlew bootRun --no-daemon > /tmp/bootRun.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/ai-example/actuator/health/readiness >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8080/ai-example/actuator/health/readiness >/dev/null; then
            echo 'Java 未就绪，bootRun 日志：'
            tail -n 200 /tmp/bootRun.log
            exit 1
          fi
          cd ../frontend
          pnpm --ignore-workspace test:e2e

      - name: 上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
