server:
  port: 8081

spring:
  application:
    name: ai-example-mcp-server
  ai:
    mcp:
      server:
        name: ai-example-mcp
        version: 0.1.0
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
      client:
        enabled: false

# 与主应用 MCP_BEARER_TOKEN / app.ai.mcp.remote-bearer-token 保持一致
app:
  mcp:
    auth:
      bearer-token: ${MCP_BEARER_TOKEN:dev-mcp-token}
