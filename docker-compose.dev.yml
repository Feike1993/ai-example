services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  jaeger:
    ports:
      - "${JAEGER_OTLP_PORT:-4318}:4318"

  mcp-server:
    ports:
      - "${MCP_PORT:-8081}:8081"

  java-a:
    ports:
      - "${JAVA_A_PORT:-8080}:8080"

  java-b:
    ports:
      - "${JAVA_B_PORT:-8082}:8080"
