global:
  scrape_interval: 10s

scrape_configs:
  - job_name: java
    metrics_path: /ai-example/actuator/prometheus
    authorization:
      type: Bearer
      credentials: dev-metrics-token
    static_configs:
      - targets:
          - java-a:8080
          - java-b:8080
        labels:
          app: ai-example
